# Single source of truth for dependency versions.
# Libraries without a version are managed by the Spring Boot BOM (see daqiqa.java-conventions).

[versions]
spring-boot = "4.1.1"
spotless = "8.10.2"
palantir-java-format = "2.98.0"
h3 = "4.5.0"
java-uuid-generator = "5.2.0"
jspecify = "1.0.0"
archunit = "1.5.0"
jqwik = "1.10.1"
springdoc = "3.1.1"
resilience4j = "2.4.0"

[libraries]
# Build plugins (used by build-logic)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# Platforms
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Explicit versions
h3 = { module = "com.uber:h3", version.ref = "h3" }
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }

# Managed by the Spring Boot BOM
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
mockito-core = { module = "org.mockito:mockito-core" }
postgresql = { module = "org.postgresql:postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
