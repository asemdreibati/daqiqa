spring:
  application:
    name: daqiqa-server
  threads:
    virtual:
      enabled: true # Java 21 virtual threads: blocking I/O without thread-pool exhaustion (ADR-0013)
  datasource:
    url: ${DAQIQA_DB_URL:jdbc:postgresql://localhost:5432/daqiqa}
    username: ${DAQIQA_DB_USER:daqiqa}
    password: ${DAQIQA_DB_PASSWORD:daqiqa}
    hikari:
      maximum-pool-size: ${DAQIQA_DB_POOL_SIZE:20}
      # An exhausted pool answers 503 TEMPORARILY_UNAVAILABLE within 2 s (GlobalProblemHandler) instead of holding
      # the request for Hikari's default 30 s. Milliseconds.
      connection-timeout: 2000
      # Bound every lock wait. A checkout stuck behind a hot stock row fails fast (the client retries with its
      # idempotency key) instead of piling up connections. Scheduled jobs pick their work with SKIP LOCKED or
      # try-locks and cap their own waits with SET LOCAL lock_timeout, so contention costs them a round, not a thread.
      connection-init-sql: "SET lock_timeout = '3s'"
  flyway:
    # db/migration: the schema, owned by each module. The Dubai demo data (db/demo) comes with the dev profile only.
    locations: ${DAQIQA_FLYWAY_LOCATIONS:classpath:db/migration}
    out-of-order: true # modules own disjoint major versions; see docs/engineering/conventions.md
  mvc:
    problemdetails:
      # RFC 9457 for framework errors too. GlobalProblemHandler replaces Boot's handler and adds the house format.
      enabled: true
  kafka:
    bootstrap-servers: ${DAQIQA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5 # at most 5 keeps idempotent retries in order
        max.block.ms: 5000 # at most the relay's send timeout: send() must not stall the relay longer
        linger.ms: 0 # the relay sends one event and waits for it; batching delay would be pure latency
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000 # below daqiqa.messaging.kafka.send-timeout: a recorded failure is final
    # Never set spring.kafka.producer.transaction-id-prefix: Boot would add a KafkaTransactionManager that displaces
    # the JDBC transaction manager the outbox and checkout rely on.

daqiqa:
  messaging:
    # kafka by default, so a missing setting can never silently drop events. Use logging for runs without a broker.
    publisher: ${DAQIQA_EVENT_PUBLISHER:kafka}
  promise:
    token:
      # No signing key ships with the server, and it does not start without one. Mount keys from a secret store as
      # daqiqa.promise.token.keys.<id> (for example DAQIQA_PROMISE_TOKEN_KEYS_K1=$(openssl rand -base64 32)) and name
      # the one that signs here. The published development key is in application-dev.yaml; the server refuses to start
      # with it unless the dev profile is active.
      active-key-id: ${DAQIQA_PROMISE_TOKEN_KEY_ID:}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # The hand-written contract (api/openapi, copied into the jar by processResources), not the document springdoc
    # derives from the code; that one stays at /v3/api-docs.
    url: /openapi/daqiqa-v1.yaml

logging:
  structured:
    format:
      console: ${DAQIQA_LOG_FORMAT:} # set to "ecs" for JSON logs
