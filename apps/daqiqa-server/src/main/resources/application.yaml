spring:
  application:
    name: daqiqa-server
  threads:
    virtual:
      enabled: true # Java 21 virtual threads: blocking I/O without thread-pool exhaustion
  datasource:
    url: ${DAQIQA_DB_URL:jdbc:postgresql://localhost:5432/daqiqa}
    username: ${DAQIQA_DB_USER:daqiqa}
    password: ${DAQIQA_DB_PASSWORD:daqiqa}
    hikari:
      maximum-pool-size: ${DAQIQA_DB_POOL_SIZE:20}
  flyway:
    # db/migration: schema owned by each module. db/demo: demo data (disable in real deployments).
    locations: ${DAQIQA_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
    out-of-order: true # modules own disjoint major versions; see docs/engineering/conventions.md
  mvc:
    problemdetails:
      enabled: true # RFC 9457 responses for framework errors too

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${DAQIQA_LOG_FORMAT:} # set to "ecs" for JSON logs
